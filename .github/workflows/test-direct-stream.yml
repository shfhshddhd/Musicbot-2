name: Direct Stream Test (Isolated)

on:
  workflow_dispatch:
  push:
    branches:
      - direct-stream-test-20261010

permissions:
  contents: read

concurrency:
  group: direct-stream-test-20261010-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate test branch and inspect downloader safely
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          ref: direct-stream-test-20261010
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated test dependency
        run: python -m pip install --disable-pip-version-check aiohttp PyYAML

      - name: Check Python syntax
        run: python -m compileall -q AloneX tests

      - name: Check workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path(".github/workflows/test-direct-stream.yml")
          with path.open(encoding="utf-8") as stream:
              yaml.safe_load(stream)
          print(f"YAML OK: {path}")
          PY

      - name: Inspect packed downloader without secrets
        run: |
          python - <<'PY'
          import ast
          import base64
          import re
          import zlib
          from pathlib import Path

          path = Path("AloneX/core/youtube.py")
          source = path.read_text(encoding="utf-8")
          match = re.search(r'base64\.b64decode\("([^"]+)"\)', source)
          if not match:
              raise SystemExit("Could not locate packed downloader payload")
          decoded = zlib.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          compile(decoded, str(path), "exec")
          print("Packed downloader decoded and syntax-checked.")
          print("Downloader source length:", len(decoded))
          PY

      - name: Exercise progressive stream against a slow local API
        run: python tests/test_progressive_audio.py

      - name: Confirm isolated branch
        run: |
          test "$(git branch --show-current)" = "direct-stream-test-20261010"
          echo "Validation completed on direct-stream-test-20261010."
          echo "The live bot was not started and no Telegram secrets were used."
